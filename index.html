<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>un/shield</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/ui.js" defer></script>
        <script src="js/audio.js" defer></script>
        <script src="js/location.js" defer></script>
    </head>
    <body>
        <main>
            <!-- <h1>un/shield</h1> -->
            <div id="splash">
                <h1>un/shield</h1>
                <button id="start-button" onclick="startApp()">start</button>
            </div>
            <div id="map"></div>
            <div id="options" class="hidden">
                <p id="geo-text">tracking disabled</p>
                <input type="button" id="geo-enable" value="enable tracking" onclick="startTracking()">
                <input type="button" id="geo-disable" value="disable tracking" onclick="stopTracking()" disabled>
                <br>
                <input type="button" id="audio-enable" value="enable listening" onclick="startListening()">
                <input type="button" id="audio-disable" value="disable listening" onclick="stopListening()" disabled>
                <br>
                <label for="input-select">input:</label>
                <select name="inputs" id="input-select" onchange="inputChanged()">
                    <option value="">Default</option>
                </select>
                <br>
                <input type="button" id="refresh-devices" value="refresh devices" onclick="refreshDevices()">
                <br>
                <label for="reverb-select">reverb:</label>
                <select name="reverbs" id="reverb-select" onchange="overrideReverb()">
                    <option value="0">None</option>
                    <option value="1">Blockhaus</option>
                    <option value="2">Coupole</option>
                    <option value="3">Wiederstandsnest</option>
                </select>
                <br>
                <textarea id="info-text" rows="8"></textarea>
                <br>
                <input type="button" id="set-blockhaus" value="set blockhaus" onclick="setMapPoint(pointBlockhaus)">
                <input type="button" id="set-coupole" value="set coupole" onclick="setMapPoint(pointCoupole)">
                <input type="button" id="set-wiederstandsnest" value="set wiederstandsnest" onclick="setMapPoint(pointWiederstandsnest)">
            </div>
        </main>
        <footer></footer>
    </body>
</html>
