<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>un/shield</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/ui.js" defer></script>
        <script src="js/audio.js" defer></script>
        <script src="js/location.js" defer></script>
    </head>
    <body>
        <main>
            <div id="splash">
                <div>
                    <p>Paul Devens</p>
                    <h1>Un/shield</h1>
                </div>
                <button id="start-button" onclick="startApp()">Start</button>
            </div>
            <div class="tab-bar">
                <button class="tab active" data-panel="panel-map">Map</button>
                <button class="tab" data-panel="panel-colophon">Colophon</button>
                <!-- <button class="tab" data-panel="panel-help">Help</button> -->
                <button class="tab hidden" data-panel="panel-options" id="tab-options">Options</button>
            </div>
            <div class="panel active" id="panel-map">
                <div id="map"></div>
            </div>
            <div class="panel" id="panel-colophon">
                <select id="lang-select">
                    <option value="lt">LT</option>
                    <option value="en">EN</option>
                    <option value="nl">NL</option>
                </select>
                <p data-i18n="colophon1"></p>
                <p data-i18n="colophon2"></p>
                <p data-i18n="colophon3"></p>
                <p data-i18n="colophon4"></p>
                <p data-i18n="colophon5"></p>
                <ul>
                    <li data-i18n="colophon6_1"></li>
                    <li data-i18n="colophon6_2"></li>
                    <li data-i18n="colophon6_3"></li>
                    <li data-i18n="colophon6_4"></li>
                </ul>
                <ul>
                    <li data-i18n="colophon7_1"></li>
                    <li data-i18n="colophon7_2"></li>
                    <li data-i18n="colophon7_3"></li>
                    <li data-i18n="colophon7_4"></li>
                </ul>
            </div>
            <!-- <div class="panel" id="panel-help"></div> -->
            <div class="panel" id="panel-options">
                <h2>Location</h2>
                <button id="geo-enable" onclick="startTracking()">Enable</button>
                <button id="geo-disable" onclick="stopTracking()" disabled>Disable</button>
                <br>
                <label for="map-view-select">Map view:</label>
                <select name="map view" id="map-view-select">
                    <option value="bounds">Bounds</option>
                    <option value="location">Location</option>
                    <option value="free">Free</option>
                </select>
                <br>
                <button id="set-blockhaus" onclick="setMapPoint(pointBlockhaus)">Set Blockhaus</button>
                <button id="set-coupole" onclick="setMapPoint(pointCoupole)">Set Coupole</button>
                <button id="set-wiederstandsnest" onclick="setMapPoint(pointWiederstandsnest)">Set Wiederstandsnest</button>
                <h2>Audio</h2>
                <button id="audio-enable" onclick="startListening()">Enable</button>
                <button id="audio-disable" onclick="stopListening()" disabled>Disable</button>
                <br>
                <label for="input-select">Input:</label>
                <select name="inputs" id="input-select" onchange="inputChanged()">
                    <option value="">Default</option>
                </select>
                <br>
                <button id="refresh-devices" onclick="refreshDevices()">Refresh inputs</button>
                <br>
                <label for="reverb-select">Reverb:</label>
                <select name="reverbs" id="reverb-select" onchange="overrideReverb()">
                    <option value="0">None</option>
                    <option value="1">Blockhaus</option>
                    <option value="2">Coupole</option>
                    <option value="3">Wiederstandsnest</option>
                </select>
                <h2>Info</h2>
                <textarea id="info-text" rows="8"></textarea>
                <br>
                <p id="geo-text">tracking disabled</p>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
