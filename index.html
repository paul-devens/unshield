<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>un/shield</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/ui.js" defer></script>
        <script src="js/audio.js" defer></script>
        <script src="js/location.js" defer></script>
    </head>
    <body>
        <main>
            <div id="splash">
                <div>
                    <p>Paul Devens</p>
                    <h1>Un/shield</h1>
                </div>
                <button id="start-button" onclick="startApp()">Start</button>
            </div>
            <div class="tab-bar">
                <button class="tab active" data-panel="panel-map">Map</button>
                <button class="tab" data-panel="panel-colophon">Colophon</button>
                <!-- <button class="tab" data-panel="panel-help">Help</button> -->
                <button class="tab hidden" data-panel="panel-options" id="tab-options">Options</button>
            </div>
            <div class="panel active" id="panel-map">
                <div id="map"></div>
            </div>
            <div class="panel" id="panel-colophon">
                <!-- <label for="language-select">Language:</label>
                <select>
                    <option>LT</option>
                    <option>EN</option>
                    <option>NL</option>
                </select> -->
                <embed id="colophon-txt" src="colophon.txt">
            </div>
            <!-- <div class="panel" id="panel-help"></div> -->
            <div class="panel" id="panel-options">
                <button id="geo-enable" onclick="startTracking()">enable tracking</button>
                <button id="geo-disable" onclick="stopTracking()" disabled>disable tracking</button>
                <br>
                <button id="audio-enable" onclick="startListening()">enable listening</button>
                <button id="audio-disable" onclick="stopListening()" disabled>disable listening</button>
                <br>
                <label for="input-select">input:</label>
                <select name="inputs" id="input-select" onchange="inputChanged()">
                    <option value="">Default</option>
                </select>
                <br>
                <button id="refresh-devices" onclick="refreshDevices()">refresh devices</button>
                <br>
                <label for="reverb-select">reverb:</label>
                <select name="reverbs" id="reverb-select" onchange="overrideReverb()">
                    <option value="0">None</option>
                    <option value="1">Blockhaus</option>
                    <option value="2">Coupole</option>
                    <option value="3">Wiederstandsnest</option>
                </select>
                <br>
                <button id="set-blockhaus" onclick="setMapPoint(pointBlockhaus)">set blockhaus</button>
                <button id="set-coupole" onclick="setMapPoint(pointCoupole)">set coupole</button>
                <button id="set-wiederstandsnest" onclick="setMapPoint(pointWiederstandsnest)">set wiederstandsnest</button>
                <br>
                <textarea id="info-text" rows="8"></textarea>
                <br>
                <p id="geo-text">tracking disabled</p>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
